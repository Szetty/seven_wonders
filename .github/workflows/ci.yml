name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust (mise.toml)
      uses: jdx/mise-action@v4
      with:
        install_args: rust
    - name: Cache cargo registry and target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          core/target
        key: ${{ runner.os }}-core-${{ hashFiles('mise.toml', 'core/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-core-
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      run: cargo test
  helios:
    name: Helios
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: helios
    steps:
    - uses: actions/checkout@v7
    - name: Install Erlang, Elixir and Rust (mise.toml)
      uses: jdx/mise-action@v4
    - name: Cache deps, build and NIF target
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          helios/deps
          helios/_build
          core/target
        key: ${{ runner.os }}-helios-${{ hashFiles('mise.toml', 'helios/mix.lock', 'core/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-helios-
    - name: Install Hex and Rebar
      run: mix local.hex --force && mix local.rebar --force
    - name: Install dependencies
      run: mix deps.get
    - name: Check for unused dependencies
      run: mix deps.unlock --check-unused
    - name: Compile (builds the NIF)
      run: mix compile --warnings-as-errors
    - name: Check formatting
      run: mix format --check-formatted
    - name: Test
      run: mix test
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force
      - name: Cache Mix and Cargo builds
        uses: actions/cache@v6
        with:
          path: |
            helios/deps
            helios/_build
            core/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('helios/mix.lock', 'core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-e2e-
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Elixir deps
        working-directory: helios
        run: mix deps.get
      - name: Compile Helios for e2e
        # Pre-compiling (including the Rust NIF) keeps server boot inside
        # Playwright's 180 s webServer timeout.
        working-directory: helios
        env:
          MIX_ENV: e2e
        run: mix do compile + assets.setup
      - name: Install npm deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
  old_backend:
    name: Old Backend
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: "TEST"
      JWT_SECRET: "test"
    defaults:
      run:
        working-directory: backend_old
    steps:
    - name: Install Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.16.x
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Test
      run: go test ./...
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: jorelali/setup-elm@v3
      with:
        elm-version: 0.19.1
    - uses: actions/checkout@v2
    - run: npm install
    - run: sudo npm install -g elm-github-install create-elm-app@4.2.16 --unsafe-perm=true
    - run: elm-app build
    - run: elm-app test
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      ACCESS_TOKEN: "TEST"
      JWT_SECRET: "test"
      LOG_LEVEL: "error"
    defaults:
      run:
        working-directory: integration-tests
    needs: [old_backend]
    steps:
      - uses: actions/checkout@v2
      - run: cd ../backend_old && go build && cd ../integration-tests
      - run: npm install
      - run: ../backend_old/backend_old & npm test
